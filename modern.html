<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Modern Services Flipbook</title>
  <style>
    body {
      margin: 0; padding: 0; background: #f9f9f9;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #800000;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    header img {
      max-height: 60px;
      vertical-align: middle;
    }
    header h1 {
      display: inline-block;
      margin: 0 0 0 15px;
      vertical-align: middle;
      font-size: 1.5rem;
    }
    #flipbook {
      width: 90%;
      height: 600px;
      margin: 30px auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      background: white;
    }
    .page {
      width: 100%;
      height: 100%;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Anglican_Church_of_Kenya_logo.svg/1200px-Anglican_Church_of_Kenya_logo.svg.png" alt="ACK Logo">
    <h1>ACK St. Faith's Church Ongata Rongai</h1>
  </header>

  <div id="flipbook"></div>

  <!-- Include jQuery (required by turn.js) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Turn.js (local) -->
  <script src="js/turn.min.js"></script>

  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.js";
  </script>

  <script>
    const url = "our-modern-services-compressed.pdf"; // your PDF file
    const flipbook = document.getElementById('flipbook');

    const renderPage = async (num, pdf) => {
      const page = await pdf.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: context, viewport }).promise;

      const div = document.createElement("div");
      div.className = "page";
      div.appendChild(canvas);
      flipbook.appendChild(div);
    };

    const loadFlipbook = async () => {
      const pdf = await pdfjsLib.getDocument(url).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        await renderPage(i, pdf);
      }
      $("#flipbook").turn({
        width: 800,
        height: 600,
        autoCenter: true
      });
    };

    loadFlipbook();
  </script>

</body>
</html>
