<main class="py-4 px-4">
  <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
    📘 Our Modern Services
  </h2>

  <!-- PDF Viewer (desktop/tablet only) -->
  <div id="pdf-viewer" style="width: 100%; max-width: 100%; height: 90vh; display: none;">
    <embed 
      src="our-modern-services-compressed.pdf#toolbar=1&navpanes=0&scrollbar=1" 
      type="application/pdf" 
      width="100%" 
      height="100%" 
      style="border: none;" />
  </div>

  <!-- Fallback download (mobile only) -->
  <div id="pdf-download" class="mt-6 text-center" style="display: none;">
    <p class="text-sm text-gray-700 mb-2">
      📱 Your device may not support viewing this PDF in-browser.
      <br>
      Please <strong>tap below</strong> to open or download:
    </p>

    <a href="our-modern-services-compressed.pdf" 
       class="bg-[#800000] text-white px-5 py-3 rounded shadow hover:bg-red-700 inline-flex items-center gap-2 text-lg"
       target="_blank"
       onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
           viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
      </svg>
      Open PDF
    </a>
  </div>
</main>

<script>
  // Simple mobile detection
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  if (isMobile) {
    document.getElementById('pdf-download').style.display = 'block';
  } else {
    document.getElementById('pdf-viewer').style.display = 'block';
  }
</script>
